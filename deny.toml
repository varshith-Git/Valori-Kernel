# cargo-deny configuration
# Copyright (c) 2025 Varshith Gudur. Dual-licensed under MIT OR Apache-2.0.
#
# Enforced on every PR via EmbarkStudios/cargo-deny-action.
# See docs/phases/phase-1.10-ci-upgrades.md § D3 for rationale.
#
# Run locally: cargo deny check
#
# Schema: cargo-deny v2 (0.14+). The pre-v2 severity keys
# (vulnerability/unmaintained/unsound/notice, licenses.deny/unlicensed/copyleft)
# were removed upstream — under v2, anything not explicitly allowed is denied.

# Build the dependency graph with all features enabled so optional deps behind
# feature gates are still audited (replaces the old `--all-features` CLI flag).
[graph]
all-features = true
# matmul_engine is an optional path dep (../../INT sibling repo) activated only by
# the `int` feature of valori-embedded. It never ships in CI or production builds
# and is not subject to our license/ban policy.
exclude = ["matmul_engine"]

[licenses]
version = 2
# Allowed licenses for all transitive dependencies. Anything not listed here is
# denied — so copyleft (AGPL/GPL/SSPL) is rejected simply by omission.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "Zlib",
    # webpki-roots ships Mozilla's CA certificate set under this permissive
    # data license (pulled in via ureq for the `valori cluster` HTTP client).
    "CDLA-Permissive-2.0",
]
# Note: "OpenSSL" and "Unicode-DFS-2016" are NOT in the global allow list
# because they only appear in the exceptions below (ring and unicode-ident).
# Listing them here causes a license-not-encountered warning.
confidence-threshold = 0.8
# Crates with unusual or dual license expressions — reviewed and accepted.
exceptions = [
    # ring uses both ISC and OpenSSL. We accept both.
    { allow = ["ISC", "OpenSSL"], name = "ring" },
    # unicode-ident uses Unicode-DFS-2016 which is not OSI-approved but is
    # permissive and widely accepted in the Rust ecosystem.
    { allow = ["Unicode-DFS-2016", "MIT"], name = "unicode-ident" },
]

[advisories]
version = 2
# Database: https://github.com/rustsec/advisory-db (updated daily).
db-urls = ["https://github.com/rustsec/advisory-db"]
# Under v2 every advisory (vulnerability, unsound, unmaintained) is an error
# unless its ID is listed here. Each entry below is reviewed and dated; a new,
# unlisted advisory still fails the build.
ignore = [
    # ── Unmaintained crates (no safe upgrade available; low risk) ──────────────
    # These are transitive and have no maintained replacement on our current
    # dependency tree. Previously warn-only under the old cargo-deny schema.
    "RUSTSEC-2025-0141",  # bincode unmaintained (we use bincode 2.x directly)
    "RUSTSEC-2025-0119",  # number_prefix unmaintained (via indicatif progress bars)
    "RUSTSEC-2025-0134",  # rustls-pemfile unmaintained (via the rustls/tonic chain)
    # RUSTSEC-2026-0192: ttf-parser 0.25.1 — author-declared unmaintained.
    # Pulled in via lopdf → pdf-extract → valori-ingest. No maintained drop-in
    # replacement exists that lopdf can switch to today.
    "RUSTSEC-2026-0192",  # ttf-parser: upstream declared unmaintained

    # ── Locked transitive vulnerabilities — upgrade blocked by upstream ────────
    # RUSTSEC-2026-0194 + RUSTSEC-2026-0195: quick-xml 0.37.5 — quadratic CPU in
    # duplicate-attribute check and unbounded namespace-declaration heap in NsReader.
    # Both require quick-xml >=0.41.0. Blocked by reqsign 0.16.5 which pins 0.37.5.
    # We do not parse untrusted XML; reqsign uses it only for AWS credential
    # response parsing from our own infrastructure endpoints.
    # TODO: remove both once reqsign ships with quick-xml >=0.41.
    "RUSTSEC-2026-0194",  # quick-xml: quadratic attribute duplicate check
    "RUSTSEC-2026-0195",  # quick-xml: unbounded heap in NsReader namespace resolver
]

[bans]
# Prevent wildcard dependencies (they bypass Cargo.lock reproducibility)...
wildcards = "deny"
# ...but the internal workspace crates depend on each other by `path` with no
# version, which cargo-deny sees as a wildcard. Those are not registry deps and
# don't affect reproducibility, so exempt path-based wildcards.
allow-wildcard-paths = true
# Warn on multiple versions of the same crate — indicates dependency hell.
multiple-versions = "warn"
# Crates that must never appear in the dependency tree.
deny = [
    # openssl: prefer rustls. openssl C linkage makes cross-compilation painful
    # and the audit surface is large.
    { name = "openssl" },
    { name = "openssl-sys" },
]
# Permitted duplicates — multiple major versions required by different parts of
# the dependency tree (axum/tonic/opendal ecosystem version skew). Each entry
# is the older version to skip; the newest is implicitly required.
skip = [
  # base64: metrics-exporter-prometheus pins 0.21; headers/hyper need 0.22; opendal needs 0.23
  { name = "base64", version = "=0.21.7" },
  { name = "base64", version = "=0.22.1" },
  # bitflags: nix/rustix/redb pull 1.x; everything else is on 2.x
  { name = "bitflags", version = "=1.3.2" },
  # block-buffer / crypto-common / digest / sha1 / sha2 / md-5 / cpufeatures:
  # older RustCrypto 0.10.x chain pulled in by aes-gcm / ed25519-dalek;
  # newer via blake3 / reqsign
  { name = "block-buffer", version = "=0.10.4" },
  { name = "cpufeatures", version = "=0.2.17" },
  { name = "crypto-common", version = "=0.1.7" },
  { name = "digest", version = "=0.10.7" },
  { name = "md-5", version = "=0.10.6" },
  { name = "sha1", version = "=0.10.7" },
  { name = "sha2", version = "=0.10.9" },
  # derive_more: openraft pins 1.0.0; valori-node is on a newer 2.x
  { name = "derive_more", version = "=1.0.0" },
  { name = "derive_more-impl", version = "=1.0.0" },
  # getrandom: ring pins 0.2; blake3 / rand 0.9 need 0.3
  { name = "getrandom", version = "=0.2.17" },
  { name = "getrandom", version = "=0.3.4" },
  # hashbrown: multiple major versions across indexmap, ahash, hashbrown direct
  { name = "hashbrown", version = "=0.12.3" },
  { name = "hashbrown", version = "=0.13.1" },
  { name = "hashbrown", version = "=0.14.5" },
  # http / http-body / hyper: tonic / older axum layers still on 0.x
  { name = "http", version = "=0.2.12" },
  { name = "http-body", version = "=0.4.6" },
  { name = "hyper", version = "=0.14.32" },
  # indexmap: openraft / older serde_json pin 1.x; newer deps need 2.x
  { name = "indexmap", version = "=1.9.3" },
  # quick-xml: reqsign pins 0.37.5; blocked by upstream (RUSTSEC-2026-0194/95 ignored)
  { name = "quick-xml", version = "=0.37.5" },
  # r-efi: two minor versions coexist via opendal's win32 deps
  { name = "r-efi", version = "=5.3.0" },
  # rand / rand_chacha / rand_core: ring pins 0.6/0.8; newer blake3/getrandom need 0.9+
  { name = "rand", version = "=0.8.7" },
  { name = "rand", version = "=0.10.2" },
  { name = "rand_chacha", version = "=0.3.1" },
  { name = "rand_core", version = "=0.6.4" },
  { name = "rand_core", version = "=0.10.1" },
  # reqwest: valori-node uses 0.12; opendal http transport needs 0.13
  { name = "reqwest", version = "=0.12.28" },
  # rustc-hash: older ahash chain
  { name = "rustc-hash", version = "=1.1.0" },
  # socket2: tokio pins 0.5.x; newer OS-level socket deps need 0.6+
  { name = "socket2", version = "=0.5.10" },
  # spin: ring 0.17 uses 0.9.x; opendal/crc-fast needs 0.10.x
  { name = "spin", version = "=0.10.1" },
  # syn: proc-macros across the tree compiled against 2.x and 3.x
  { name = "syn", version = "=2.0.119" },
  # thiserror: crates compiled against 1.x and 2.x simultaneously
  { name = "thiserror", version = "=1.0.69" },
  { name = "thiserror-impl", version = "=1.0.69" },
  # tower / tower-http: hyper 0.14 layer needs 0.4; axum 0.7 needs 0.5
  { name = "tower", version = "=0.4.13" },
  { name = "tower-http", version = "=0.5.2" },
  # wasm-streams / webpki-roots: reqwest 0.12 vs 0.13 pull different versions
  { name = "wasm-streams", version = "=0.4.2" },
  { name = "webpki-roots", version = "=0.26.11" },
  # windows-sys / windows-targets / windows_*: multiple major versions required
  # across tokio, mio, socket2, and windows-rs ecosystem
  { name = "windows-sys", version = "=0.48.0" },
  { name = "windows-sys", version = "=0.52.0" },
  { name = "windows-sys", version = "=0.59.0" },
  { name = "windows-targets", version = "=0.48.5" },
  { name = "windows_aarch64_gnullvm", version = "=0.48.5" },
  { name = "windows_aarch64_msvc", version = "=0.48.5" },
  { name = "windows_i686_gnu", version = "=0.48.5" },
  { name = "windows_i686_msvc", version = "=0.48.5" },
  { name = "windows_x86_64_gnu", version = "=0.48.5" },
  { name = "windows_x86_64_gnullvm", version = "=0.48.5" },
  { name = "windows_x86_64_msvc", version = "=0.48.5" },
]
# Allow build-only duplicates (e.g. proc-macro crates at different versions).
skip-tree = []

[sources]
# Only allow crates from crates.io and our own workspace paths.
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
allow-git        = []
