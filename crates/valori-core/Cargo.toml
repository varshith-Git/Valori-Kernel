[package]
name = "valori-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Minimal-dependency shared types for the Valori platform (IDs, enums, errors, traits)"

# ── no_std by default ─────────────────────────────────────────────────────────
# valori-core must compile for embedded and WASM targets with no OS dependency.
# Opt in to std via the "std" feature (enabled automatically for valori-node,
# valori-consensus, and any std crate via features = ["std"]).
[dependencies]
serde     = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
thiserror = { version = "2.0", default-features = false }
getrandom = { version = "0.2", optional = true }

# getrandom 0.2 has no default WASM syscall backend; the js feature uses the
# browser / Cloudflare Worker crypto API instead.  Without this the kernel
# fails to compile for wasm32-unknown-unknown when the std feature is on.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[features]
default = ["std"]
std = ["thiserror/std", "dep:getrandom"]

# No dev-dependencies — core is intentionally dependency-free.

[lints]
workspace = true
