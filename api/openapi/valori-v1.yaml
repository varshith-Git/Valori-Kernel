      type: object
    PoolStatsSchema:
      description: Slab occupancy for one kernel pool (records, graph nodes, graph edges).
      properties:
        capacity:
          description: Configured slab capacity.
          minimum: 0
          type: integer
        fill_pct:
          description: '`live / capacity` as a percentage, rounded to one decimal.'
          format: double
          type: number
        live:
          description: Live (non-tombstoned) entries.
          minimum: 0
          type: integer
        slots_used:
          description: Slab slots consumed, including tombstones.
          minimum: 0
          type: integer
      required:
      - live
      - slots_used
      - capacity
      - fill_pct
      type: object
    Receipt:
      description: |-
        The unified proof of one completed Operation, as it crosses the wire.

        Mirrors [`valori_effect::Receipt`], which lives in a crate with no `utoipa`
        dependency — the same translation-layer arrangement as [`ApiError`].

        # Why this type exists

        Phase API-3.3: `GET /v1/proof/receipt` and `GET /v1/proof/receipt/{id}`
        were annotated `body = Object`, which renders as a bare `type: object` with
        no properties. Generators produce `object` in TypeScript and
        `Dict[str, Any]` in Python — so the receipt, which is the entire point of
        a verifiable memory system, arrived in every SDK as an opaque blob with no
        discoverable field.

        The handlers return `serde_json::to_value(&Receipt)`, and `Receipt` is a
        fully concrete struct. Nothing about it was ever unknowable; it simply was
        not written down.

        `tests/api_contract.rs::receipt_dto_matches_the_runtime_receipt` serialises
        a real `Receipt` and diffs its key set against this type, so the two cannot
        drift.
      properties:
        cluster_mode:
          description: Whether the producing node was running in cluster mode.
          type: boolean
        committed_height:
          description: Committed log height at production time.
          format: int64
          minimum: 0
          type: integer
        embed_enabled:
          description: Whether embedding was enabled on the node that produced this.
          type: boolean
        fragments:
          description: Per-task fragments in topological order.
          items:
            $ref: '#/components/schemas/ReceiptFragment'
          type: array
        graph_hash:
          description: '`BLAKE3(op_hash ‖ fp.hash ‖ ctx_hash ‖ topo_order)` for the task graph.'
          type: string
        kernel_abi_version:
          description: Kernel ABI the operation ran against.
          format: int32
          minimum: 0
          type: integer
        operation_hash:
          description: '`BLAKE3(kind ‖ inputs ‖ policy)` for the operation.'
          type: string
        parent_receipts:
          description: Parent receipt hashes in the Merkle DAG. Empty for a root receipt.
          items:
            items:
              format: int32
              minimum: 0
              type: integer
            type: array
          type: array
        planner_fingerprint_hash:
          description: '`BLAKE3(version ‖ routing_config_hash ‖ feature_flags_hash ‖ schema_version)`.'
          type: string
        produced_at:
          description: Unix seconds. Deliberately excluded from `receipt_hash`.
          format: int64
          minimum: 0
          type: integer
        receipt_hash:
          description: |-
            Content-addressed BLAKE3 of the receipt, as 32 raw bytes.

            `ReceiptHash` is a `[u8; 32]` newtype, so it crosses the wire as an
            array of 32 integers — not the hex string `to_hex()` produces.
          items:
            format: int32
            minimum: 0
            type: integer
          type: array
        receipt_id:
          description: Unique id for this receipt.
          type: string
        shard_count:
          description: Shard count on the producing node.
          format: int32
          minimum: 0
          type: integer
        shard_id:
          description: Shard that produced this receipt.
          format: int32
          minimum: 0
          type: integer
        state_hash_after:
          description: BLAKE3 hex of kernel state after. Equal to `before` for read-only operations.
          type: string
        state_hash_before:
          description: BLAKE3 hex of kernel state before the operation.
          type: string
      required:
      - receipt_id
      - receipt_hash
      - operation_hash
      - graph_hash
      - kernel_abi_version
      - planner_fingerprint_hash
      - embed_enabled
      - cluster_mode
      - shard_count
      - state_hash_before
      - state_hash_after
      - parent_receipts
      - shard_id
      - committed_height
      - produced_at
      - fragments
      type: object
    ReceiptFragment:
      description: |-
        One task's contribution to a [`ReceiptDto`], mirroring
        [`valori_effect::ReceiptFragment`].
      properties:
        fragment_hash:
          description: BLAKE3 hex of the fragment itself, used for chaining.
          type: string
        mutated:
          description: True if this task produced kernel writes.
          type: boolean
        state_hash_after:
          description: BLAKE3 hex of the kernel state after this task. Equal to `before` for reads.
          type: string
        state_hash_before:
          description: BLAKE3 hex of the kernel state before this task.
          type: string
        task_index:
          description: Position of this task in the executed graph's topological order.
          format: int32
          minimum: 0
          type: integer
      required:
      - task_index
      - state_hash_before
      - state_hash_after
      - mutated
      - fragment_hash
      type: object
    RecordResponse:
      description: '`GET /v1/records/{id}` — one stored record, decoded back to `f32`.'
      properties:
        id:
          format: int32
          minimum: 0
          type: integer
        metadata:
          description: Whatever JSON was committed alongside the record, if any.
          type:
          - object
          - 'null'
        tag:
          format: int64
          minimum: 0
          type: integer
        vector:
          description: |-
            The stored Q16.16 vector, converted back to `f32` for the wire.
            Round-tripping is lossy at the Q16.16 quantum, by design.
          items:
            format: float
            type: number
          type: array
      required:
      - id
      - vector
      - tag
      type: object
    RequestId:
      description: '16-byte client idempotency token. A replay returns the record the first request created, with `deduplicated: true`.'
      oneOf:
      - description: 32 hex characters; UUID dashes optional.
        type: string
      - items:
          type: integer
        maxItems: 16
        minItems: 16
        type: array
    RestoreFromStoreRequest:
      properties:
        key:
          description: |-
            Object key returned by a previous upload or list call. Omit to
            restore whatever `manifest.json` currently names as current — see
            `GET /v1/storage/manifest`; this is now the recommended entry point
            for disaster recovery instead of listing `snapshots/` and picking
            the newest filename by hand.
          type:
          - string
          - 'null'
      type: object
    RestoreFromStoreResponse:
      properties:
        key:
          type: string
        size_bytes:
          minimum: 0
          type: integer
        state_hash:
          type: string
      required:
      - key
      - state_hash
      - size_bytes
      type: object
    SearchHit:
      properties:
        age_secs:
          description: |-
            Age of the record in seconds at query time. Present only when decay is
            active and the record's creation time is known.
          format: int64
          minimum: 0
          type:
          - integer
          - 'null'
        decay_factor:
          description: |-
            Phase C4.1 — applied decay factor in (0, 1]. Present only when decay is
            active. `score` stays the true (undecayed) L2 distance for honesty;
            ranking reflects `score / decay_factor`.
          format: float
          type:
          - number
          - 'null'
        graph_distance:
          description: |-
            G1.4.1 — hop distance to the nearest `graph_rerank` seed. Present
            only when `graph_rerank` was requested. `None` within that means
            the candidate has no graph node, or is unreachable within
            `max_depth` — never causes a candidate to be dropped.
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        id:
          format: int32
          minimum: 0
          type: integer
        score:
          format: float
          type: number
      required:
      - id
      - score
      type: object
    SearchRequest:
      properties:
        as_of:
          description: |-
            ISO 8601 UTC timestamp — search the vector state as it existed at this moment.
            Requires the event log to be enabled (`VALORI_EVENT_LOG_PATH`).
          type:
          - string
          - 'null'
        as_of_log_index:
          description: |-
            Log index — search the vector state after exactly this many committed events.
            Mutually exclusive with `as_of`; `as_of_log_index` takes precedence if both given.
          format: int64
          minimum: 0
          type:
          - integer
          - 'null'
        collection:
          type:
          - string
          - 'null'
        decay_half_life_secs:
          description: |-
            Phase C4.1 — recency half-life in seconds. When set (> 0), results are
            re-ranked so older records decay: a record one half-life old has its L2
            distance doubled. `0`/absent uses the server default (or pure distance).
            Ignored for `as_of` / point-in-time queries.
          format: int64
          minimum: 0
          type:
          - integer
          - 'null'
        graph_rerank:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/GraphRerankRequest'
            description: |-
              G1.4.1 — optional graph-aware reranking. Presence enables it;
              absence is a complete no-op (identical to pre-G1.4.1 behavior).
              Composes with either `rerank` (BM25) or `decay_half_life_secs` — it
              runs as a final pass over whatever score the rest of the pipeline
              already produced, using each hit's existing `score` as the base.
        k:
          minimum: 0
          type: integer
        metadata_filter:
          description: |-
            Optional JSON object whose key-value pairs must ALL be present (and equal)
            in a record's metadata for the record to be returned.
            Numeric values support optional range operators: `{"gte": 2020, "lte": 2024}`.
            Example: `{"author": "Alice", "year": {"gte": 2020}}`
          type:
          - object
          - 'null'
        query:
          items:
            format: float
            type: number
          type: array
        query_text:
          description: |-
            The raw query string used for BM25 scoring. Required when `rerank=true`.
            Ignored when `rerank=false`.
          type:
          - string
          - 'null'
        rerank:
          description: |-
            BM25 hybrid reranking. When `true` (default), the server fetches
            `k × POOL_FACTOR` candidates by vector similarity and re-ranks them by
            a 50/50 blend of normalised vector score + BM25 term-frequency score
            before returning the top-k. Requires `query_text` to be set.
            Set to `false` to get pure vector ranking (legacy behaviour).
          type: boolean
      required:
      - query
      - k
      type: object
    SearchResponse:
      properties:
        as_of_log_index:
          description: 'Present only for as-of searches: the log index of the replayed state.'
          format: int64
          minimum: 0
          type:
          - integer
          - 'null'
        as_of_state_hash:
          description: BLAKE3 hex hash of the kernel state at `as_of_log_index`.
          type:
          - string
          - 'null'
        as_of_timestamp_iso:
          description: ISO 8601 string of `as_of_timestamp_unix`.
          type:
          - string
          - 'null'
        as_of_timestamp_unix:
          description: Unix-second wall-clock timestamp of the `as_of_log_index` event.
          format: int64
          minimum: 0
          type:
          - integer
          - 'null'
        results:
          items:
            $ref: '#/components/schemas/SearchHit'
          type: array
      required:
      - results
      type: object
    ShardRoutingEntry:
      description: One shard's collection assignment in `GET /v1/shard/routing`.
      properties:
        collections:
          items:
            type: string
          type: array
        shard:
          minimum: 0
          type: integer
      required:
      - shard
      - collections
      type: object
    ShardRoutingResponse:
      description: |-
        `GET /v1/shard/routing` — which collection lives on which logical shard.
        Routing is `namespace_id % shard_count`.
      properties:
        mode:
          description: '`standalone` or `cluster`.'
          type: string
        shard_count:
          minimum: 0
          type: integer
        shards:
          items:
            $ref: '#/components/schemas/ShardRoutingEntry'
          type: array
      required:
      - mode
      - shard_count
      - shards
      type: object
    SnapshotBytes:
      description: |-
        Raw snapshot bytes, as the OpenAPI binary idiom.

        Phase API-3.3: `/v1/snapshot/download` and `/v1/snapshot/upload` were
        annotated `body = Vec<u8>`, which utoipa renders literally — `type: array,
        items: {type: integer, format: int32}`. Generators believe it: the
        throwaway Python client typed the download as `list[int]`, so restoring a
        snapshot meant round-tripping every byte of a multi-megabyte file through
        a Python integer list.

        `type: string, format: binary` is the OpenAPI idiom for an opaque byte
        stream, and generators map it to `bytes` / `Blob` / `File`. The wire format
        is unchanged — this describes the same octet-stream correctly.
      format: binary
      type: string
    SnapshotEntry:
      properties:
        epoch_secs:
          description: Unix epoch seconds extracted from the key name — used for sorting.
          format: int64
          minimum: 0
          type: integer
        key:
          description: Full object key (e.g. `"prefix/snapshots/00000001750000000_abc12345.snap"`).
          type: string
        size_bytes:
          description: Snapshot size in bytes.
          format: int64
          minimum: 0
          type: integer
        state_hash:
          description: Hex BLAKE3 state hash recorded alongside the snapshot.
          type: string
      required:
      - key
      - state_hash
      - epoch_secs
      - size_bytes
      type: object
    SnapshotManifest:
      description: |-
        `manifest.json` — the entry point for disaster recovery. Written
        alongside every snapshot upload (see [`ObjectStoreBackend::
        upload_snapshot_and_update_manifest`]), it names the ONE snapshot that
        is current (out of however many timestamped `.snap` objects exist under
        `snapshots/` — old ones aren't deleted until `prune_snapshots` runs) plus
        the WAL segments archived since, so a restore tool has a single object
        to fetch instead of listing-and-sorting `snapshots/`/`wal/` and hoping
        the newest filename really is the right one.
      properties:
        current_snapshot:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SnapshotEntry'
            description: |-
              `None` only if a manifest was written before any snapshot ever
              succeeded — shouldn't happen in practice since
              `upload_snapshot_and_update_manifest` always has a just-uploaded
              snapshot to point at, but kept optional rather than a fabricated
              placeholder entry.
        node_version:
          description: |-
            `CARGO_PKG_VERSION` of whatever wrote this manifest (valori-node,
            normally) — lets a restore tool detect "this snapshot was written by
            an older/newer node than the one about to restore it."
          type: string
        schema_version:
          format: int32
          minimum: 0
          type: integer
        updated_at:
          description: Unix epoch seconds when this manifest was last written.
          format: int64
          minimum: 0
          type: integer
        wal_segments:
          items:
            $ref: '#/components/schemas/WalEntry'
          type: array
      required:
      - schema_version
      - node_version
      - wal_segments
      - updated_at
      type: object
    SnapshotRestoreRequest:
      properties:
        path:
          type: string
      required:
      - path
      type: object
    SnapshotRestoreResponse:
      properties:
        success:
          type: boolean
      required:
      - success
      type: object
    SnapshotSaveRequest:
      properties:
        path:
          type:
          - string
          - 'null'
      type: object
    SnapshotSaveResponse:
      properties:
        path:
          type: string
        success:
          type: boolean
      required:
      - success
      - path
      type: object
    StageMetrics:
      description: Format-specific counters emitted by each stage. E4.1.
      oneOf:
