components:
  schemas:
    ApiError:
      description: |-
        The canonical error body, as a schema-bearing DTO.

        [`valori_engine::EngineError`] produces this shape at runtime but lives in
        a crate that does not depend on `utoipa`, so the schema is declared here —
        the translation layer §36 asks for, rather than a re-export of an internal
        type.
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
          description: Stable machine-readable code. Branch on this.
        error:
          description: Human-readable message. Do not parse.
          type: string
      required:
      - error
      - code
      type: object
    ArchiveWalRequest:
      properties:
        path:
          description: Absolute path on this node's local filesystem to the sealed segment.
          type: string
      required:
      - path
      type: object
    ArchiveWalResponse:
      properties:
        key:
          type: string
        size_bytes:
          format: int64
          minimum: 0
          type: integer
      required:
      - key
      - size_bytes
      type: object
    BatchInsertRequest:
      properties:
        batch:
          items:
            items:
              format: float
              type: number
            type: array
          type: array
        collection:
          type:
          - string
          - 'null'
        metadata:
          description: |-
            Optional per-vector metadata blobs (UTF-8 JSON strings).
            If present, must be the same length as `batch`.
            Each entry is committed inside the `InsertRecord` event and is
            therefore included in the BLAKE3 audit chain.
          items:
            type:
            - string
            - 'null'
          type:
          - array
          - 'null'
        request_ids:
          description: |-
            Per-item idempotency keys (32-hex strings = 16-byte UUIDs).
            If present, must be the same length as `batch`. A null entry means
            "no dedup key for this item". A repeated key causes that item to be
            skipped and the previously assigned ID is returned instead.
          items:
            type:
            - string
            - 'null'
          type:
          - array
          - 'null'
        texts:
          description: |-
            Optional per-vector text strings for BM25 hybrid reranking.
            If present, must be the same length as `batch`. A null entry means
            no text is stored for that vector. Text is tokenised and indexed
            so that future /search calls with `rerank=true` can re-score results.
          items:
            type:
            - string
            - 'null'
          type:
          - array
          - 'null'
      required:
      - batch
      type: object
    BatchInsertResponse:
      properties:
        ids:
          items:
            format: int32
            minimum: 0
            type: integer
          type: array
      required:
      - ids
      type: object
    BuildableIndexKind:
      description: |-
        The index kinds `POST /v1/namespaces/{name}/index` will actually build.

        Phase API-3.3: narrower than the project-wide `IndexKindInput`, and
        deliberately so. The build task in both routers matches on exactly three
        strings — `"hnsw"`, `"ivf"`, `"bq"` — and its `_` arm returns
        `"unknown index type '<x>'"`. `brute` and `auto` are project-level
        selections, not buildable per-collection ANN structures, so they are not
        members here; sending one is an error, and the schema now says so instead
        of advertising an open `string`.

        `null` is the fourth valid value and means *drop the index*. It is carried
        by the `Option`, not by a variant.
      enum:
      - hnsw
      - ivf
      - bq
      type: string
    ClusterHealthResponse:
      description: '`GET /v1/cluster/health` response.'
      properties:
        detail:
          description: Present only on the `no-leader` path.
          type:
          - string
          - 'null'
        leader:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/u64'
        status:
          description: '`ok` when a leader is visible, `no-leader` otherwise.'
          type: string
      required:
      - status
      type: object
    ClusterHealthStats:
      description: The `cluster` sub-object of `GET /health`. Cluster mode only.
      properties:
        dim:
          description: Vector dimension the cluster locked on first insert, if any.
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        leader:
          description: Node id of the leader this node currently sees, if any.
          format: int64
          minimum: 0
          type:
          - integer
          - 'null'
        role:
          description: Raft role of this node (`Leader`, `Follower`, `Candidate`, `Learner`).
          type: string
        status:
          description: '`ok` when this node sees an elected leader, `no-leader` otherwise.'
          type: string
        term:
          format: int64
          minimum: 0
          type: integer
      required:
      - status
      - role
      - term
      type: object
    ClusterProofResponse:
      description: '`GET /v1/cluster/proof` response.'
      properties:
        final_state_hash:
          description: 64 lowercase hex characters (32 bytes).
          type: string
        last_applied_index:
          description: |-
            Raft index this hash was taken at. Two peers only need to agree when
            compared at the same index.
          format: int64
          minimum: 0
          type:
          - integer
          - 'null'
        node_id:
          format: int64
          minimum: 0
          type: integer
        term:
          format: int64
          minimum: 0
          type: integer
      required:
      - node_id
      - final_state_hash
      - term
      type: object
    ClusterRoleResponse:
      description: '`GET /v1/cluster/role` response.'
      properties:
        current_leader:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/u64'
            description: The leader this node currently believes in, if any.
        node_id:
          $ref: '#/components/schemas/u64'
        role:
          description: '`leader` or `follower`. Both are healthy.'
          type: string
      required:
      - role
      - node_id
      type: object
    CollectionInfo:
      properties:
        dimension:
          description: Present only for collections created with an explicit vector config.
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        id:
          format: int32
          minimum: 0
          type: integer
        index:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/IndexKind'
        max_records:
          minimum: 0
          type:
          - integer
          - 'null'
        metric:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Metric'
        name:
          type: string
        record_count:
          minimum: 0
          type:
          - integer
          - 'null'
      required:
      - name
      - id
      type: object
    CommunityDetectRequest:
      properties:
        max_iter:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        namespace:
          type:
          - string
          - 'null'
      type: object
    CommunityDetectResponse:
      properties:
        communities:
          items:
            $ref: '#/components/schemas/CommunitySummary'
          type: array
        community_count:
          minimum: 0
          type: integer
        node_count:
          minimum: 0
          type: integer
        receipt:
          description: BLAKE3 hex receipt over sorted assignments.
          type: string
      required:
      - community_count
      - node_count
      - communities
      - receipt
      type: object
    CommunityHit:
      properties:
        community_id:
          format: int32
          minimum: 0
          type: integer
        member_count:
          minimum: 0
          type: integer
        sample_node_ids:
          items:
            format: int32
            minimum: 0
            type: integer
          type: array
        score:
          format: float
          type: number
      required:
      - community_id
      - score
      - member_count
      - sample_node_ids
      type: object
    CommunityOverviewEntry:
      description: One community in `GET /v1/community/overview`, largest first.
      properties:
        centroid:
          description: Mean vector of the community's members.
          items:
            format: float
            type: number
          type: array
        community_id:
          format: int32
          minimum: 0
          type: integer
        member_count:
          minimum: 0
          type: integer
        sample_node_ids:
          description: Up to 10 member node ids, for a cheap preview.
          items:
            format: int32
            minimum: 0
            type: integer
          type: array
      required:
      - community_id
      - member_count
      - centroid
      - sample_node_ids
      type: object
    CommunityOverviewResponse:
      description: '`GET /v1/community/overview` — requires `POST /v1/community/detect` first.'
      properties:
        communities:
          items:
            $ref: '#/components/schemas/CommunityOverviewEntry'
          type: array
        community_count:
          minimum: 0
          type: integer
        node_count:
          minimum: 0
          type: integer
        receipt:
          description: BLAKE3 receipt over the sorted community assignment.
          type: string
      required:
      - community_count
      - node_count
      - receipt
      - communities
      type: object
    CommunitySearchRequest:
      properties:
        depth:
          format: int32
          minimum: 0
          type: integer
        drill_in:
          type: boolean
        k:
          minimum: 0
          type: integer
        namespace:
          type:
          - string
          - 'null'
        vector:
          items:
            format: float
            type: number
          type: array
      required:
      - vector
      type: object
    CommunitySearchResponse:
      properties:
        communities:
          items:
            $ref: '#/components/schemas/CommunityHit'
          type: array
        total_communities_searched:
          minimum: 0
          type: integer
      required:
      - communities
      - total_communities_searched
      type: object
    CommunitySummary:
      properties:
        centroid_record_id:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        community_id:
          format: int32
          minimum: 0
          type: integer
        member_count:
          minimum: 0
          type: integer
      required:
      - community_id
      - member_count
      type: object
    CreateCollectionRequest:
      properties:
        dimension:
          description: |-
            Vector dimension for this collection. **Required for every name** —
            `"default"` included, with no exception (Phase 3.3). Valori does not
            infer a collection's dimension from its first insert or from any
            project/env-level default; `POST` without it is rejected with 400.
            Immutable after creation; a later request with a different value for
            the same collection is rejected, not silently applied.

            The Rust field stays `Option` so that a missing value reaches
            `parse_collection_config` and is answered with that explanatory 400
            rather than a generic deserialization failure. `required = true`
            records the contract-level truth the handler enforces, so a generated
            SDK makes the argument mandatory instead of silently omittable.
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        index:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/IndexKindInput'
            description: |-
              Index algorithm: `"brute"`, `"hnsw"`, `"ivf"`, `"bq"`, or `"auto"`.
              Optional — omitting it means `index = NONE` (exact
              namespace-specific search, no dedicated ANN structure), a
              first-class supported state, not a missing feature. Requires
              `dimension` to also be set — a collection cannot have an explicit
              index without an explicit dimension, since the index is constructed
              for that dimension at creation time.
        metric:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/MetricInput'
            description: |-
              Distance metric. **Required for every name** — `"default"` included,
              with no exception (Phase 3.3). Sent explicitly over the wire, never
              assumed. Only `"squared_l2"` is supported today; present as a field
              (not hard-coded) so the wire contract does not need to change when a
              second metric is added.

              See `dimension` for why this is `Option` in Rust but `required` in the
              contract.
        name:
          type: string
      required:
      - name
      - dimension
      - metric
      type: object
    CreateCollectionResponse:
      properties:
        created:
          type: boolean
        id:
          format: int32
          minimum: 0
          type: integer
        name:
          type: string
      required:
      - name
      - id
      - created
      type: object
    CreateEdgeRequest:
      properties:
        collection:
          type:
          - string
          - 'null'
        from:
          format: int32
          minimum: 0
          type: integer
        kind:
          format: int32
          minimum: 0
          type: integer
        to:
          format: int32
          minimum: 0
          type: integer
      required:
      - from
      - to
      - kind
      type: object
    CreateEdgeResponse:
      properties:
        edge_id:
          format: int32
          minimum: 0
          type: integer
        log_index:
          description: Raft log index of the committed write — cluster path only.
          format: int64
          minimum: 0
          type:
          - integer
          - 'null'
      required:
      - edge_id
      type: object
    CreateNodeRequest:
      properties:
        collection:
          type:
          - string
          - 'null'
        kind:
          format: int32
          minimum: 0
          type: integer
        record_id:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
      required:
      - kind
      type: object
    CreateNodeResponse:
      properties:
        log_index:
          description: Raft log index of the committed write — cluster path only.
          format: int64
          minimum: 0
          type:
          - integer
          - 'null'
        node_id:
          format: int32
          minimum: 0
          type: integer
      required:
      - node_id
      type: object
    CryptoStatusResponse:
      properties:
        exists:
          type: boolean
        key_id:
          type: string
      required:
      - key_id
      - exists
      type: object
    DeleteNodeResponse:
      properties:
        log_index:
          description: Raft log index of the committed write — cluster path only.
          format: int64
          minimum: 0
          type:
          - integer
          - 'null'
        success:
          type: boolean
      required:
      - success
      type: object
    DeleteRecordRequest:
      properties:
        collection:
          type:
          - string
          - 'null'
        id:
          format: int32
          minimum: 0
          type: integer
      required:
      - id
      type: object
    DeleteRecordResponse:
      properties:
        log_index:
          description: Raft log index of the committed write — cluster path only.
          format: int64
          minimum: 0
          type:
          - integer
          - 'null'
        success:
          type: boolean
      required:
      - success
      type: object
    EdgeData:
      properties:
        edge_id:
          format: int32
          minimum: 0
          type: integer
        kind:
          format: int32
          minimum: 0
          type: integer
        to_node:
          format: int32
          minimum: 0
          type: integer
      required:
      - edge_id
      - to_node
      - kind
      type: object
    EngineHealthStats:
      description: |-
        The `engine` sub-object of `GET /health`. Standalone mode only; absent in
        cluster mode, where the node has no single in-process engine to describe.
      properties:
        collections:
          minimum: 0
          type: integer
        edges:
          $ref: '#/components/schemas/PoolStatsSchema'
        embed_enabled:
          type: boolean
        embed_provider:
          type:
          - string
          - 'null'
        event_log_height:
          format: int64
          minimum: 0
          type:
          - integer
          - 'null'
        event_log_path:
          type:
          - string
          - 'null'
        nodes:
          $ref: '#/components/schemas/PoolStatsSchema'
        persistence:
          description: '`event_log`, `wal`, `snapshot`, or `none`.'
          type: string
        records:
          $ref: '#/components/schemas/PoolStatsSchema'
        shard_count:
          minimum: 0
          type: integer
        snapshot_path:
          type:
          - string
          - 'null'
        status:
          type: string
        version:
          type: string
      required:
      - status
      - version
      - collections
      - persistence
      - records
      - nodes
      - edges
      - embed_enabled
      - shard_count
      type: object
    ErrorCode:
      description: |-
        Mirror of [`valori_engine::ErrorCode`] for schema generation.

        `tests/api_contract.rs` diffs the runtime enum against the committed YAML;
        this type exists so the generated document carries the same closed set.
      enum:
      - validation_error
      - unauthorized
      - forbidden
      - not_found
      - collection_not_found
      - record_not_found
      - dimension_mismatch
      - invalid_metric
      - invalid_index
      - index_build_failed
      - conflict
      - capacity_exceeded
      - not_leader
      - unavailable
      - not_implemented
      - internal_error
      type: string
    EventProofResponse:
      properties:
        committed_height:
          format: int64
          minimum: 0
          type: integer
        event_count:
          format: int64
          minimum: 0
          type: integer
        event_log_hash:
          type: string
        final_state_hash:
          type: string
        kernel_version:
          format: int32
          minimum: 0
          type: integer
        snapshot_hash:
          type:
          - string
          - 'null'
      required:
      - kernel_version
      - event_log_hash
      - final_state_hash
      - event_count
      - committed_height
      type: object
    ExecutionRecord:
      description: |-
        A completed ingest execution, keyed by `operation_id` — the real payload
        for `GET /v1/operations/:id/execution`.
      properties:
        chunks_produced:
          minimum: 0
          type: integer
        collection:
          type: string
        document_source:
          type: string
        error:
          type:
          - string
          - 'null'
        operation_id:
          type: string
        receipt_id:
          description: |-
            Present when the operation's receipt was emitted before this record
            was built — always true for the standalone `/v1/ingest` path.
          type:
          - string
          - 'null'
        records_written:
          minimum: 0
          type: integer
        stages:
          items:
            $ref: '#/components/schemas/StageView'
          type: array
        state_hash_after:
          type:
          - string
          - 'null'
        state_hash_before:
          type:
          - string
          - 'null'
        success:
          type: boolean
        total_duration_ms:
          format: int64
          minimum: 0
          type: integer
      required:
      - operation_id
      - document_source
      - collection
      - stages
      - chunks_produced
      - records_written
      - total_duration_ms
      - success
      type: object
    ExtractEntitiesRequest:
      properties:
        entity_types:
          items:
            type: string
          type: array
        model:
          type:
          - string
          - 'null'
        namespace:
          type:
          - string
          - 'null'
        text:
          type: string
      required:
      - text
      type: object
    ExtractEntitiesResponse:
      properties:
        entities:
          items:
            $ref: '#/components/schemas/InsertedEntity'
          type: array
        entity_count:
          minimum: 0
          type: integer
        relationship_count:
          minimum: 0
          type: integer
        relationships:
          items:
            $ref: '#/components/schemas/InsertedRelationship'
          type: array
        skipped_relationships:
          minimum: 0
          type: integer
      required:
      - entities
      - relationships
      - entity_count
      - relationship_count
      - skipped_relationships
      type: object
    GetEdgesResponse:
      properties:
        edges:
          items:
            $ref: '#/components/schemas/EdgeData'
          type: array
      required:
      - edges
      type: object
    GetNodeResponse:
      properties:
        kind:
          format: int32
          minimum: 0
          type: integer
        namespace_id:
          format: int32
          minimum: 0
          type: integer
        record_id:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
      required:
      - kind
      - namespace_id
      type: object
    GraphQueryHitDto:
      properties:
        depth:
          format: int32
          minimum: 0
          type: integer
        kind:
          format: int32
          minimum: 0
          type: integer
        node_id:
          format: int32
          minimum: 0
          type: integer
        record_id:
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
      required:
      - node_id
      - kind
      - depth
      type: object
    GraphQueryResponse:
      properties:
        count:
          minimum: 0
          type: integer
        hits:
          items:
            $ref: '#/components/schemas/GraphQueryHitDto'
          type: array
      required:
      - hits
      - count
      type: object
    GraphRagHit:
      description: |-
        One blended vector + graph hit from `POST /v1/graphrag`.

        Phase API-3.3: `GraphRagResponse.hits` was `Vec<Object>`, so GraphRAG — a
        headline retrieval feature — returned `object[]` to every generated SDK.
        The producer is `capabilities.rs`, which builds a fixed ten-key object.

        Several scores are nullable by design: a hit reached purely through graph
        expansion has no vector distance, so `score` and `vector_score` are `null`
        on it. `final_score` and `graph_score` are always present.
      properties:
        final_score:
          description: Combined score in `[0, 1]`. Always present; rank on this.
          format: float
          type: number
        graph_distance:
          description: Hop count from the nearest seed node, when reachable.
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        graph_score:
          description: Normalised graph relevance in `[0, 1]`.
          format: float
          type: number
        memory_id:
          description: Stable memory identity, `rec:<record_id>`.
          type: string
        metadata:
          additionalProperties: {}
          description: Caller-supplied metadata stored alongside the record, if any.
          propertyNames:
            type: string
          type:
          - object
          - 'null'
        node_id:
          description: Graph node for this record, when it has one.
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        record_id:
          description: The underlying record.
          format: int32
          minimum: 0
          type: integer
        score:
          description: |-
            Vector distance. `null` for a graph-only hit. Retained for backward
            compatibility; `vector_score` is the explicit spelling of the same value.
          format: float
          type:
          - number
          - 'null'
        source:
          description: How this hit entered the result set — e.g. `vector`, `graph`.
          type: string
        vector_score:
          description: Vector distance. `null` for a graph-only hit.
          format: float
          type:
          - number
          - 'null'
      required:
      - memory_id
      - record_id
      - graph_score
      - final_score
      - source
      type: object
    GraphRagRequest:
      properties:
        collection:
          type:
          - string
          - 'null'
        depth:
          format: int32
          minimum: 0
          type: integer
        final_k:
          description: Maximum returned hits. Absent = defaults to `retrieval_k` (Phase 5.4).
          minimum: 0
          type:
          - integer
          - 'null'
        graph_weight:
          description: 'Phase 5.4: β in `final_score = (1-β)×vector_rel + β×graph_rel`. Range [0,1].'
          format: float
          type: number
        k:
          description: Legacy alias for `retrieval_k`. When `retrieval_k` is absent, `k` is used.
          minimum: 0
          type:
          - integer
          - 'null'
        max_edges:
          description: 'Phase 5.4: halt edge emission once this count is reached per BFS round.'
          minimum: 0
          type:
          - integer
          - 'null'
        max_graph_candidates:
          description: Budget on graph-only candidates (applied before `final_k`). Absent = 100.
          minimum: 0
          type:
          - integer
          - 'null'
        max_nodes:
          description: 'Phase 5.4: halt BFS before visiting a node that would exceed this count.'
          minimum: 0
          type:
          - integer
          - 'null'
        query_vector:
          items:
            format: float
            type: number
          type: array
        retrieval_k:
          description: How many vector candidates to use as seeds for graph expansion.
          minimum: 0
          type:
          - integer
          - 'null'
      required:
      - query_vector
      type: object
    GraphRagResponse:
      description: |-
        `POST /v1/graphrag` — K nearest vectors plus the connected subgraph around
        them, read from one consistent kernel snapshot.
      properties:
        hits:
          description: Blended vector + graph hits, best first.
          items:
            $ref: '#/components/schemas/GraphRagHit'
          type: array
        seed_nodes:
          description: Graph node ids the vector hits seeded the expansion from.
          items:
            format: int32
            minimum: 0
            type: integer
          type: array
        subgraph:
          $ref: '#/components/schemas/SubgraphResponse'
      required:
      - hits
      - seed_nodes
      - subgraph
      type: object
    GraphRerankRequest:
      properties:
        direction:
          description: |-
            `"outgoing"` (default) | `"incoming"` | `"both"` — case-insensitive,
            same convention as `GET /v1/graph/query`.
          type:
          - string
          - 'null'
        max_depth:
          description: |-
            Max hop count from the seed set. Clamped to `query_graph`'s own
            `MAX_DEPTH` (4), never rejected.
          format: int32
          minimum: 0
          type: integer
        seed_count:
          description: |-
            Number of top vector hits to resolve as graph seeds. Clamped
            `[1, 10]` server-side (never rejected).
          minimum: 0
          type: integer
        weight:
          description: |-
            Multiplier weight per hop of graph distance. Clamped `[0.0, 1.0]`
            server-side. `adjusted = score * (1 + weight * distance)`.
          format: float
          type: number
      type: object
