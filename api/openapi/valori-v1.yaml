          type: string
        record_ids:
          items:
            format: int32
            minimum: 0
            type: integer
          type: array
        strategy_used:
          type: string
      required:
      - ok
      - document_node_id
      - strategy_used
      - chunk_count
      - record_ids
      - collection
      - operation_id
      type: object
    IngestUpdateRequest:
