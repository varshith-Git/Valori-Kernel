      - raft_addr
      - api_addr
      - voter
      type: object
    MemoryConsolidateRequest:
      description: |-
        Replace an existing memory record with a new vector, committing a
        SoftDeleteRecord + AutoInsertRecord + AutoCreateEdge(Supersedes) to the
        BLAKE3 audit chain in one logical operation.
      properties:
        collection:
          type:
          - string
          - 'null'
        metadata:
          type:
          - object
          - 'null'
        new_vector:
          description: New vector that replaces the old memory.
          items:
            format: float
            type: number
          type: array
        old_record_id:
          description: Record id of the memory being replaced.
          format: int32
          minimum: 0
          type: integer
      required:
      - old_record_id
      - new_vector
      type: object
    MemoryConsolidateResponse:
      properties:
        log_index:
          format: int64
          minimum: 0
          type:
          - integer
          - 'null'
        new_record_id:
          description: The new record id.
          format: int32
          minimum: 0
          type: integer
        old_record_id:
          description: The old record id (now soft-deleted).
          format: int32
          minimum: 0
          type: integer
        state_hash:
          description: BLAKE3 state hash after all three events are applied.
          type: string
        supersedes_edge_id:
          description: The Supersedes edge id linking new → old.
          format: int32
