    UsageStorage:
      description: The `storage` sub-object of `GET /v1/usage`.
      properties:
        event_log_bytes:
          description: Live event-log segment plus every rotated archive segment.
          format: int64
          minimum: 0
          type: integer
        snapshot_bytes:
          format: int64
          minimum: 0
          type: integer
        total_bytes:
          format: int64
          minimum: 0
          type: integer
      required:
      - event_log_bytes
      - snapshot_bytes
      - total_bytes
      type: object
    WalEntry:
      properties:
        key:
          description: Full object key.
          type: string
        size_bytes:
          description: Segment size in bytes.
          format: int64
          minimum: 0
          type: integer
      required:
      - key
      - size_bytes
      type: object
    u64:
      format: int64
      minimum: 0
      type: integer
  securitySchemes:
    BearerAuth:
      description: Project API key or the legacy VALORI_AUTH_TOKEN bearer token.
      scheme: bearer
      type: http
info:
  description: 'The Valori Data Plane REST API v1, emitted directly from `#[utoipa::path]` annotations on the registered axum handlers. Every public route the Rust routers register appears here and nothing else does — `scripts/verify-api-route-contract.py` proves that equality on every run of the contract gate, and fails on any drift in either direction. Administrative and operator-internal routes (key management, cluster membership, replication streams, `/metrics`) are deliberately excluded: they are served by the node but are not part of the SDK surface.'
  license:
    identifier: MIT OR Apache-2.0
    name: MIT OR Apache-2.0
  title: Valori Data Plane API
  version: 1.0.0
openapi: 3.1.0
paths:
  /health:
    get:
      description: Always unauthenticated so load-balancer probes work without a token. Returns the legacy top-level fields alongside the structured `engine` / `cluster` sub-objects (Phase API-3 §11).
      operationId: get_health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: Node is serving
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: At least one kernel pool is at 100% capacity (standalone), or this node sees no elected leader (cluster). The body is the same HealthResponse; branch on `status`.
      security: []
      summary: Node health and capacity snapshot
      tags:
      - meta
      x-sdk: true
  /v1/cluster/health:
    get:
      description: '503 with `status: no-leader` during an election. Distinct from `GET /health`, which reports this node''s own serving capacity.'
      operationId: get_cluster_health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterHealthResponse'
          description: A leader is elected
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: 'Missing or invalid credentials. The auth middleware rejects the request before the handler runs; `attach_error_code` renders the rejection as a canonical `ApiError` with `code: "unauthorized"`.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: 'The presented key authenticated but its scope does not satisfy this operation''s `x-required-scope`. Rendered as a canonical `ApiError` with `code: "forbidden"`.'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterHealthResponse'
          description: No leader currently visible from this node
      security:
      - BearerAuth: []
      summary: Whether this node sees an elected leader
      tags:
      - cluster
      x-required-scope: read_only
      x-sdk: true
  /v1/cluster/proof:
    get:
      description: The cluster analogue of `GET /v1/proof/state`. Comparing `final_state_hash` across peers at the same `last_applied_index` is how convergence is verified.
      operationId: get_cluster_proof
