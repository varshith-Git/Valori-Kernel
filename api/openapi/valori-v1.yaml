        m:
          minimum: 0
          type: integer
        m_max0:
          minimum: 0
          type: integer
      required:
      - m
      - m_max0
      - ef_construction
      - ef_search
      type: object
    IndexBuildParameters:
      description: |-
        The tuning knobs `POST /v1/namespaces/{name}/index` actually reads.

        Phase API-3.3: [`IndexBuildRequest::parameters`] is a `serde_json::Value`,
        which utoipa rendered as a schema with no `type` at all — `unknown` in
        TypeScript, `Any` in Python, and nothing whatsoever for a user to discover
        the knob names from. It was the only genuinely untyped field in the public
        surface.

        The runtime is not actually open-ended: both routers read exactly five
        keys, all unsigned integers — `m`, `ef_construction`, `ef_search` for HNSW
        (`server.rs` / `cluster_server.rs`, the `"hnsw"` arm) and `n_list`,
        `n_probe` for IVF (the `"ivf"` arm). This type names them.

        `additionalProperties` stays open because the documented behaviour is that
        unknown keys are *ignored*, not rejected — so a client sending one is not
        making an error, and the schema must not claim otherwise.
      properties:
        ef_construction:
          description: 'HNSW: candidate-list size during construction.'
          format: int64
          minimum: 0
          type:
          - integer
          - 'null'
        ef_search:
          description: 'HNSW: candidate-list size during search.'
          format: int64
          minimum: 0
          type:
          - integer
          - 'null'
        m:
          description: 'HNSW: neighbours per node. `m_max0` is derived as `2 * m`.'
          format: int64
          minimum: 0
          type:
          - integer
          - 'null'
        n_list:
          description: 'IVF: centroid count. Omit to auto-scale to `max(16, sqrt(N))`.'
          format: int64
          minimum: 0
          type:
          - integer
          - 'null'
        n_probe:
          description: 'IVF: probe count. Omit to auto-scale to `max(1, sqrt(n_list))`.'
          format: int64
          minimum: 0
          type:
          - integer
          - 'null'
      type: object
    IndexBuildRequest:
      description: The request body for `POST /v1/namespaces/{name}/index`.
      properties:
        parameters:
          $ref: '#/components/schemas/IndexBuildParameters'
          description: |-
            Optional parameter overrides. Only the parameters the implementation
            actually reads are used; unknown keys are ignored.

            Stays a `serde_json::Value` at runtime — the handlers index into it by
            key and tolerate anything — but is *described* as
            [`IndexBuildParameters`] so a generated SDK can offer the real knobs.
        type:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/BuildableIndexKind'
            description: '`"hnsw"`, `"ivf"`, `"bq"`, or `null` (drop the index).'
      type: object
    IndexConfigResponse:
      properties:
        hnsw:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/HnswConfigView'
        index_type:
          type: string
      required:
      - index_type
      type: object
    IndexKind:
      description: |-
        The `index` values a response can contain — canonical only, matching
        [`valori_domain::IndexKind`]'s `as_str`.
      enum:
      - brute
      - hnsw
      - ivf
      - bq
      - auto
      type: string
    IndexKindInput:
      description: |-
        The `index` values a request may send — canonical plus the aliases
        [`valori_domain::IndexKind`]'s `FromStr` accepts.

        Omitting `index` entirely is a distinct, first-class state (`index = NONE`,
        exact namespace-scoped search with no dedicated ANN structure) and is not
        represented here — absence is the representation.
      enum:
      - brute
      - bruteforce
      - hnsw
      - ivf
      - bq
      - auto
      - mstg
      type: string
    IndexRebuildRequest:
      description: |-
        `POST /v1/index/rebuild` request body. Project-wide rebuild; per-collection
        lifecycle lives at `/v1/namespaces/{name}/index`.
      properties:
        index:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/IndexKindInput'
            description: |-
              Echoed back as `effective`. Present for forward compatibility; the
              standalone rebuild always rebuilds every per-collection index.
      type: object
    IndexRebuildResponse:
      description: '`POST /v1/index/rebuild` response.'
      properties:
        effective:
          description: The `index` value from the request, or `"rebuilt"` when it was absent.
          type: string
        ok:
          type: boolean
        records:
          description: Live record count after the rebuild.
          minimum: 0
          type: integer
      required:
      - ok
      - effective
      - records
      type: object
    IndexStatusResponse:
      description: |-
        Response to `POST /v1/namespaces/{name}/index` and
        `GET /v1/namespaces/{name}/index`.

        # Cluster vs standalone distinction

        In cluster mode, `desired_type` is always populated from the Raft-
        replicated desired spec (what the cluster wants), while `active_type`
        and `status` reflect this **node's local** build state. They may
        differ temporarily as builds propagate across replicas.

        Example during a transition:
        ```json
        { "desired_type": "ivf", "active_type": "hnsw", "status": "building",
          "building_generation": 2, "active_generation": 1 }
        ```

        In standalone mode, `desired_type` is always equal to `active_type` once
        a build completes (there's only one node).
      properties:
        active_generation:
          description: The active generation number, if any.
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        active_type:
          description: The currently serving index type ("hnsw", "ivf", "bq", "none").
          type: string
        base_lsn:
          description: The base LSN of the building generation.
          format: int64
          minimum: 0
          type:
          - integer
          - 'null'
        build_started_at:
          description: Unix seconds when the current build started.
          format: int64
          minimum: 0
          type:
          - integer
          - 'null'
        building_generation:
          description: If a build is in progress, its generation number.
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        collection:
          type: string
        desired_type:
          description: |-
            The type the user requested (may differ from active while building).
            In cluster mode, this comes from the Raft-replicated desired spec and
            is authoritative for the whole cluster, not just the responding node.
          type:
          - string
          - 'null'
        error:
          description: Human-readable failure reason, if the last build failed.
          type:
          - string
          - 'null'
        status:
          description: Current lifecycle status of the active or building generation.
          type: string
      required:
      - collection
      - active_type
      - status
      type: object
    IngestAcceptedResponse:
      description: |-
        The `202` body of `POST /v1/ingest` when `async: true`.

        The async branch has always returned this object; the contract used to
        declare the `202` with no content at all, so a generated client saw
        `never` and had no typed way to reach `job_id` — the one field the whole
        async flow depends on, since it is what `GET /v1/ingest/status/{job_id}`
        takes.
      properties:
        collection:
          type: string
        job_id:
          description: Poll `GET /v1/ingest/status/{job_id}` with this id.
          type: string
        ok:
          type: boolean
        status:
          description: Always `processing` on this response.
          type: string
      required:
      - ok
      - job_id
      - status
      - collection
      type: object
    IngestChunk:
      description: One chunk produced by a chunking strategy.
      properties:
        index:
          description: 0-based position in the chunk sequence.
          minimum: 0
          type: integer
        text:
          description: Full chunk text ready to embed.
          type: string
        title:
          description: Section title (tree strategy) or empty string.
          type: string
      required:
      - index
      - title
      - text
      type: object
    IngestDocumentRequest:
      properties:
        chunk_overlap:
          description: Fixed-strategy overlap in chars (default 200).
          minimum: 0
          type:
          - integer
          - 'null'
        chunk_size:
          description: Fixed-strategy chunk size in chars (default 1000).
          minimum: 0
          type:
          - integer
          - 'null'
        collection:
          description: Collection to ingest into (default = "default").
          type:
          - string
          - 'null'
        source:
          description: Source label stored in metadata (e.g. filename). Optional.
          type:
          - string
          - 'null'
        strategy:
          description: 'Chunking strategy: `auto` | `tree` | `conversation` | `sentence` | `fixed`.'
          type:
          - string
          - 'null'
        text:
          description: Raw text content of the document.
          type: string
      required:
      - text
      type: object
    IngestDocumentResponse:
      properties:
        chunk_count:
          description: Total number of chunks produced.
          minimum: 0
          type: integer
        chunks:
          description: |-
            The chunks. Caller embeds each `text`, inserts the vector, records
            `record_id` → chunk for provenance.
          items:
            $ref: '#/components/schemas/IngestChunk'
          type: array
        collection:
          description: Collection the document was targeted at.
          type: string
        strategy_used:
          description: Strategy that was actually used (useful when `strategy="auto"`).
          type: string
      required:
      - strategy_used
      - chunk_count
      - chunks
      - collection
      type: object
    IngestJobState:
      description: |-
        The lifecycle states an asynchronous ingest job actually reports.

        Phase API-3.3: these are the three literals both routers write — see the
        `jobs.insert(..)` calls in [`ingest`] (standalone) and `cluster_ingest`
        (cluster). There is no separate `pending`: a job is `processing` from the
        moment `POST /v1/ingest?async=true` answers `202`.
      enum:
      - processing
      - completed
      - failed
      type: string
    IngestJobStatusResponse:
      description: |-
        The body of `GET /v1/ingest/status/{job_id}`.

        # Why this type exists

        Phase API-3.3: this response was annotated `body = Object`, rendering as a
        bare `type: object` with no properties — `object` in TypeScript,
        `Dict[str, Any]` in Python. An SDK user polling an async ingest had no
        typed way to learn whether the job finished, and no discoverable name for
        the field carrying the answer. That defeats the purpose of the `202`
        contract that points here.

        Every field is optional except `status` and `job_id`, because which ones
        are present genuinely depends on the stage the job has reached — the
        terminal-success fields do not exist while it is `processing`, and `error`
        exists only on `failed`. `status` is the discriminant to branch on.
      properties:
        chunk_count:
          description: Chunks the document was split into.
          minimum: 0
          type:
          - integer
          - 'null'
        collection:
          description: Target collection. Absent on `failed` jobs that failed before resolving one.
          type:
          - string
          - 'null'
        document_node_id:
          description: '`completed` only — the graph node representing the ingested document.'
          format: int32
          minimum: 0
          type:
          - integer
          - 'null'
        error:
          description: '`failed` only — the human-readable reason.'
          type:
          - string
          - 'null'
        job_id:
          description: Echo of the polled job id.
          type: string
        operation_id:
          description: '`completed` only — correlates with `GET /v1/operations/{id}`.'
          type:
          - string
          - 'null'
        record_ids:
          description: '`completed` only — the records written, one per chunk.'
          items:
            format: int32
            minimum: 0
            type: integer
          type:
          - array
          - 'null'
        status:
          $ref: '#/components/schemas/IngestJobState'
          description: Which stage the job has reached. Branch on this.
        strategy_used:
          description: Chunking strategy the server selected.
          type:
          - string
          - 'null'
      required:
      - status
      - job_id
      type: object
    IngestRequest:
      properties:
        async:
          type:
          - boolean
          - 'null'
        chunk_overlap:
          minimum: 0
          type:
          - integer
          - 'null'
        chunk_size:
          minimum: 0
          type:
          - integer
          - 'null'
        collection:
          type:
          - string
          - 'null'
        source:
          type:
          - string
          - 'null'
        strategy:
          type:
          - string
          - 'null'
        text:
          type: string
      required:
      - text
      type: object
    IngestResponse:
