# ── notes ────────────────────────────────────────────────────────────────────
#
# `collection.*` rows are reached from a Collection handle:
#     collection = client.collections["docs"]
#
# Two rows are worth calling out because a reader may expect otherwise:
#
#   search_multi      lives on `client.collections`, not on a Collection —
#                     it is deliberately not scoped to one.
#   extract_entities  is tagged `community` in the contract but served at
#                     POST /v1/ingest/extract-entities, so it is wrapped on
#                     `client.ingest` where a user will look for it.
#
# Not represented here, and deliberately so: GET /metrics and
# GET /v1/replication/* are not in the public contract (they are operator and
# node-to-node surfaces), so they are out of scope for this manifest.
