# SDK COVERAGE MANIFEST — Phase API-4A §12
#
# Every public operationId in api/openapi/valori-v1.yaml must appear here
# exactly once, mapped to how this SDK exposes it:
#
#   wrapper:   an ergonomic, human-written method in the handwritten layer
#   generated: reachable only through the generated client (client.raw)
#
# scripts/sdk-coverage-check.py fails the build when the contract has an
# operation this file does not name, when this file names an operation the
# contract does not have, or when a declared `wrapper` does not resolve to a
# real callable in the package. That last check is what stops this file from
# becoming aspirational documentation.
#
# Handwritten semantics are NOT auto-generated. Adding a row here is a claim
# that a human wrote and tested the wrapper.

